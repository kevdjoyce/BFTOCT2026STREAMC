<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockmelon &amp; Yoghurt</title>
<style>
:root{--bg:#fff;--fg:#1c1b1f;--muted:#6b6670;--card:#f6f1f6;--accent:#8a2a6b}
@media (prefers-color-scheme:dark){:root{--bg:#17141a;--fg:#f1edf2;--muted:#a9a2ae;--card:#241f28;--accent:#e08cc3}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:20px 20px 48px}
a{color:var(--accent)}h1{margin:12px 0 4px;font-size:1.8rem;color:var(--accent)}h2{font-size:1.15rem;margin:24px 0 8px}h3{font-size:1rem;margin:16px 0 4px;color:var(--muted)}
img.hero{width:100%;height:auto;border-radius:12px;display:block}
.serves{color:var(--muted);margin:0 0 16px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.macros div{background:var(--card);border-radius:10px;padding:10px 4px;text-align:center}
.macros b{display:block;font-size:1.05rem}.macros span.l{font-size:.75rem;color:var(--muted)}
.per{font-size:.8rem;color:var(--muted);margin:0 0 8px}li{margin:6px 0}
.list{list-style:none;padding:0}.list li{display:flex;justify-content:space-between;gap:12px}.list li span{color:var(--muted);white-space:nowrap}
nav{margin:8px 0;font-size:.9rem}.notes{color:var(--muted)}
</style>
</head>
<body>
<main>
<nav><a href="index.html">&larr; Week 6</a></nav>
<div itemscope itemtype="https://schema.org/Recipe">
<img class="hero" itemprop="image" src="https://kevdjoyce.github.io/BFTOCT2026STREAMC/images/week-6.jpg" alt="Rockmelon &amp; Yoghurt" width="1200" height="630">
<h1 itemprop="name">Rockmelon &amp; Yoghurt</h1>
<p class="serves">Serves <span itemprop="recipeYield">1</span></p>
<div itemprop="nutrition" itemscope itemtype="https://schema.org/NutritionInformation">
<div class="macros"><div><b itemprop="calories">139 kcal</b><span class="l">Calories</span></div><div><b itemprop="proteinContent">16.21 g</b><span class="l">Protein</span></div><div><b itemprop="fatContent">0.65 g</b><span class="l">Fat</span></div><div><b itemprop="carbohydrateContent">15.83 g</b><span class="l">Carbs</span></div></div>
<p class="per">Nutrition per serve</p>
</div>
<h2>Ingredients</h2>
<ul>
<li><span itemprop="recipeIngredient">170 gms (6 oz) of rockmelon, diced</span></li>
<li><span itemprop="recipeIngredient">160 gms (5.6 oz) of high protein natural yoghurt</span></li>
</ul>
</div>
</main>
