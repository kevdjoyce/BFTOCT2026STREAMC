<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFT OCT 26 Stream C</title>
<style>
:root{--bg:#fff;--fg:#1c1b1f;--muted:#6b6670;--card:#f6f1f6;--accent:#8a2a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--fg:#f1edf2;--muted:#a9a2ae;--card:#241f28;--accent:#e08cc3}}
:root[data-theme="dark"]{--bg:#17141a;--fg:#f1edf2;--muted:#a9a2ae;--card:#241f28;--accent:#e08cc3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:24px 20px 48px}
a{color:var(--accent)}
h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent)}
h2{font-size:1.15rem;margin:24px 0 8px}
h3{font-size:1rem;margin:16px 0 4px;color:var(--muted)}
.serves{color:var(--muted);margin:0 0 20px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.macros div{background:var(--card);border-radius:10px;padding:10px 4px;text-align:center}
.macros b{display:block;font-size:1.05rem}
.macros span{font-size:.75rem;color:var(--muted)}
.per{font-size:.8rem;color:var(--muted);margin:0 0 8px}
li{margin:6px 0}
.list li{display:flex;justify-content:space-between;gap:12px}
.list li span{color:var(--muted);white-space:nowrap}
.notes{color:var(--muted)}
nav{margin-bottom:16px;font-size:.9rem}
</style>
</head>
<body>
